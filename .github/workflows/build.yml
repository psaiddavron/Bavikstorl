name: Build APK

on:
  push:
    paths:
      - minimarket.zip
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q minimarket.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APKs
        working-directory: minimarket
        run: gradle assembleDebug --no-daemon

      - name: Publish APKs to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mini Market, сборка ${{ github.run_number }}
          files: |
            minimarket/app/build/outputs/apk/debug/app-debug.apk
            minimarket/publisher/build/outputs/apk/debug/publisher-debug.apk
